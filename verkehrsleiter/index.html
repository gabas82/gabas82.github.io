<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verkehrsleiter — подготовка за изпит</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="app-header">
  <div class="header-row">
    <div>
      <h1>Güterkraftverkehr — Verkehrsleiter</h1>
      <p>Учебно помагало за подготовка за IHK-Fachkundeprüfung</p>
    </div>
    <div class="lang-toggle" id="lang-toggle" title="Език на въпросите, отговорите и обясненията">
      <button type="button" data-lang="bg">БГ</button>
      <button type="button" data-lang="de">DE</button>
    </div>
  </div>
</header>

<nav class="tabs">
  <button data-view="study" class="active">Учи</button>
  <button data-view="admin">Управление на съдържанието</button>
  <button data-view="stats">Статистика</button>
  <button data-view="own">Твой въпрос</button>
  <button data-view="guide">Как се ползва</button>
</nav>

<main>
  <section id="view-study" class="view active">
    <div id="study-container"></div>
  </section>

  <section id="view-admin" class="view">
    <div id="admin-container"></div>
  </section>

  <section id="view-stats" class="view">
    <div id="stats-container"></div>
  </section>

  <section id="view-own" class="view">
    <div id="own-container"></div>
  </section>

  <section id="view-guide" class="view">
    <div id="guide-container"></div>
  </section>
</main>

<footer class="app-footer">
  Данните се пазят локално в браузъра на това устройство. Изтегляй редовно резервно копие от „Управление на съдържанието“.
</footer>

<script src="seed-data.js"></script>
<script src="app.js"></script>
</body>
</html>
